# Scans every push and pull request (full history) for API keys, tokens and passwords.
# A finding fails the check, so a leaked key is caught before it is merged.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose --exit-code 1
