# Runs on every push and pull request: install, type-check, test against a real
# PostgreSQL. A red check on a pull request means "do not merge".
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      # A throwaway database that exists only for the length of this job.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_HOST_AUTH_METHOD: trust   # throwaway CI database, no password
          POSTGRES_DB: travel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d travel_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app@localhost:5432/travel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
