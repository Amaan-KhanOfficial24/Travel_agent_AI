# Local PostgreSQL for development and tests. Start: `docker compose up -d db`
# No password: the port is bound to 127.0.0.1, so only programs inside this machine /
# Codespace can connect, and there is no credential that could ever leak into Git.
# Real databases (Neon, Stage 10) always use a password, stored as a secret.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: travel
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data        # data survives container restarts
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d travel"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
